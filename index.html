<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmad Yehia — Product Manager</title>
<meta name="description" content="Ahmad Yehia, Principal Product Manager in Cairo. Marketplace, eCommerce and fulfillment products.">
<meta property="og:title" content="Ahmad Yehia — Product Manager">
<meta property="og:description" content="Principal Product Manager. Marketplace, eCommerce and fulfillment products.">
<meta name="theme-color" content="#FCFBF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="preview-bar" class="preview-bar" hidden>Preview of your unpublished draft. Visits here are not counted. Yellow notes only show in preview.</div>
<div id="app"><p class="load-msg">Loading portfolio…</p></div>
<noscript><p class="wrap load-msg">This portfolio needs JavaScript. Contact: ahmadyehiam@gmail.com</p></noscript>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var PREVIEW = params.get("preview") === "1";
  var REF = (params.get("r") || "").replace(/[^a-z0-9-]/gi, "").slice(0, 32);

  // Used until these fields are saved from the back-office
  var DEFAULTS = {
    tagline: "I make marketplaces and checkout **measurably faster**.",
    stats: [
      { value: "45s → 2s", label: "Order response time" },
      { value: "2–3 wks → 1", label: "Seller payout cycle" },
      { value: "+60%", label: "Above target, installments month 1" },
      { value: "50 → 95%", label: "MiniCash throughput" }
    ]
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // **text** = underlined highlight, ~~text~~ = struck-through, _text_ = italic
  function rich(s) {
    return esc(s)
      .replace(/~~(.+?)~~/g, '<span class="strike">$1</span>')
      .replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>')
      .replace(/(^|\s)_(.+?)_(?=[\s.,!?]|$)/g, "$1<em>$2</em>");
  }
  function safeUrl(u) { u = String(u || ""); return /^(https?:|mailto:|assets\/|\.\/|\/)/i.test(u) ? u : "#"; }

  // ---------- analytics (GoatCounter) ----------
  var queue = [];
  function track(path, title) { if (PREVIEW) return; queue.push({ path: path, title: title || path, event: true }); flush(); }
  function flush() {
    var gc = window.goatcounter;
    if (!gc || typeof gc.count !== "function") return;
    while (queue.length) { try { gc.count(queue.shift()); } catch (e) {} }
  }
  function loadAnalytics(code) {
    if (PREVIEW || !code) return;
    code = String(code).replace(/[^a-z0-9-]/gi, "");
    window.goatcounter = { path: function () { return location.pathname || "/"; } };
    var s = document.createElement("script");
    s.async = true; s.src = "https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter", "https://" + code + ".goatcounter.com/count");
    s.onload = function () { var n = 0; (function wait() { if (window.goatcounter && window.goatcounter.count) flush(); else if (n++ < 40) setTimeout(wait, 250); })(); };
    document.head.appendChild(s);
    if (REF) track("ref/" + REF, "Visit from tracked link " + REF);
  }

  function render(c) {
    var p = c.profile || {}, st = c.settings || {};
    var stats = c.stats || DEFAULTS.stats;
    var tagline = p.tagline || DEFAULTS.tagline;
    document.title = st.siteTitle || p.name || "Portfolio";
    var md = document.querySelector('meta[name="description"]');
    if (md && st.metaDescription) md.setAttribute("content", st.metaDescription);

    var title = [(p.roles || [])[0] || "Principal Product Manager", (p.location || "").split(",")[0]].filter(Boolean).join(" · ");
    var cv = st.cvUrl ? '<a class="mono" href="' + esc(safeUrl(st.cvUrl)) + '" target="_blank" rel="noopener" data-track="cv-download">Download CV</a>' : "";

    var statHtml = stats.map(function (s) { return '<div class="stat"><b>' + esc(s.value) + "</b><span>" + esc(s.label) + "</span></div>"; }).join("");

    var cases = (c.cases || []).map(function (k) {
      var secs = (k.sections || []).map(function (s) { return "<div><dt>" + esc(s.label) + "</dt><dd>" + esc(s.text) + "</dd></div>"; }).join("");
      var imgs = (k.images || []).length ? '<div class="shots">' + k.images.map(function (im) {
        return '<figure><img src="' + esc(safeUrl(im.src)) + '" alt="' + esc(im.alt) + '" loading="lazy"><figcaption>' + esc(im.caption) + "</figcaption></figure>";
      }).join("") + "</div>" : "";
      var todo = PREVIEW && k.todo ? '<p class="todo">' + esc(k.todo) + "</p>" : "";
      var more = secs || imgs ? '<details><summary>Read the case study <span class="arr" aria-hidden="true">→</span></summary><dl>' + secs + "</dl>" + imgs + "</details>" : "";
      return '<article class="case" data-id="' + esc(k.id) + '"><span class="stamp">' + esc(k.period) + '</span><div class="main">' +
        "<h3>" + esc(k.title) + '</h3><p class="sum">' + esc(k.result) + '</p><p class="tags">' + esc(k.tag) + "</p>" + more + todo + "</div></article>";
    }).join("");

    var jobs = (c.jobs || []).map(function (j) {
      return '<li><span><strong style="font-weight:500">' + esc(j.role) + "</strong> · " + esc(j.company) + '</span><span class="when">' + esc(j.when) + "</span></li>";
    }).join("");
    var creds = [].concat(c.education || [], c.certifications || []).map(function (x) { return esc(x.name); }).join(" · ");
    var story = p.about
      ? '<p class="story">' + rich(p.about) + "</p>"
      : (PREVIEW ? '<p class="story todo">Add your story under Content → Profile → About story: one or two lines on how you got into product.</p>' : "");

    document.getElementById("app").innerHTML =
      '<header class="top"><div class="wrap mono"><a class="name" href="#top">' + esc(p.name) + "</a>" +
      '<nav aria-label="Sections"><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav></div></header>' +

      '<main class="wrap">' +
      '<section class="hero" id="top"><p class="mono">' + esc(title) + "</p><h1>" + rich(tagline) + "</h1>" +
      '<p class="lede">' + esc(p.lede) + '</p><div class="links"><a href="#work" data-track="cta-case-studies">See my work</a>' +
      (p.linkedin ? '<a href="' + esc(safeUrl(p.linkedin)) + '" target="_blank" rel="noopener" data-track="linkedin">LinkedIn</a>' : "") + cv + "</div></section>" +

      (stats.length ? '<section class="results" aria-label="Results"><div class="sh mono"><span>Results</span><span>Before → after</span></div>' +
        '<div class="grid" style="--cols:' + Math.min(stats.length, 4) + '">' + statHtml + "</div></section>" : "") +

      '<section class="work" id="work" aria-labelledby="work-h"><div class="sh mono"><span id="work-h">Selected work</span><span>' + (c.cases || []).length + " case studies</span></div>" + cases + "</section>" +

      '<section class="about" id="about" aria-labelledby="about-h"><p class="label mono" id="about-h">About</p><div class="body">' + story +
      (c.experienceIntro ? '<p class="soft">' + esc(c.experienceIntro) + "</p>" : "") +
      (jobs ? '<ul class="jobs">' + jobs + "</ul>" : "") + (creds ? '<p class="creds">' + creds + "</p>" : "") + "</div></section>" +

      '<section class="contact" id="contact" aria-labelledby="contact-h"><h2 id="contact-h">' + esc(p.contactHeadline) + "</h2>" +
      '<div class="row mono"><a id="email" class="email" href="mailto:' + esc(p.email) + '" data-track="email-click">' + esc(p.email) + "</a>" +
      '<button type="button" id="copy" class="mono">Copy</button>' +
      (p.linkedin ? '<a href="' + esc(safeUrl(p.linkedin)) + '" target="_blank" rel="noopener" data-track="linkedin">LinkedIn</a>' : "") +
      '<span class="copied" id="copied" aria-live="polite"></span></div></section>' +
      "</main>" +
      '<footer><div class="wrap mono"><span>© ' + new Date().getFullYear() + " " + esc(p.fullName || p.name) + "</span><span>" + esc(p.location) + "</span></div></footer>";

    wire();
  }

  function wire() {
    document.querySelectorAll("[data-track]").forEach(function (el) {
      el.addEventListener("click", function () { track("click/" + el.getAttribute("data-track"), "Clicked " + el.getAttribute("data-track")); });
    });
    document.querySelectorAll(".case details").forEach(function (d) {
      var sent = false;
      d.addEventListener("toggle", function () {
        if (d.open && !sent) { sent = true; var id = d.closest(".case").getAttribute("data-id"); track("case/" + id, "Opened case study: " + id); }
      });
    });
    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", function () {
      var out = document.getElementById("copied"), em = document.getElementById("email");
      track("click/email-copy", "Copied email");
      function select() { var r = document.createRange(); r.selectNodeContents(em); var s = getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent = "Selected, press Ctrl/Cmd + C"; }
      if (navigator.clipboard) navigator.clipboard.writeText(em.textContent).then(function () { out.textContent = "Copied"; }, select); else select();
    });
    var contact = document.getElementById("contact");
    if (contact && "IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { track("section/contact", "Scrolled to contact"); io.disconnect(); } });
      io.observe(contact);
    }
  }

  function fail() {
    document.getElementById("app").innerHTML = '<p class="load-msg">The portfolio could not load. Please refresh, or email ahmadyehiam@gmail.com.</p>';
  }

  if (PREVIEW) {
    document.getElementById("preview-bar").hidden = false;
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem("portfolio-draft") || "null"); } catch (e) {}
    if (draft) { render(draft); return; }
  }
  fetch("content.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (c) { render(c); loadAnalytics((c.settings || {}).goatcounter); })
    .catch(fail);
})();
</script>
</body>
</html>
