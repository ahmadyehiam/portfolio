<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmad Yehia — Product Manager</title>
<meta name="description" content="Ahmad Yehia, Principal Product Manager in Cairo. Marketplace, eCommerce and fulfillment products.">
<meta property="og:title" content="Ahmad Yehia — Product Manager">
<meta property="og:description" content="Principal Product Manager. Marketplace, eCommerce and fulfillment products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="preview-bar" class="preview-bar" hidden>Preview of your unpublished draft. Visits here are not counted. Gold notes are only shown in preview.</div>
<div class="wrap" id="app"><p class="load-msg">Loading portfolio…</p></div>
<noscript><p class="wrap load-msg">This portfolio needs JavaScript. Contact: ahmadyehiam@gmail.com</p></noscript>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var PREVIEW = params.get("preview") === "1";
  var REF = (params.get("r") || "").replace(/[^a-z0-9-]/gi, "").slice(0, 32);

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // ~~text~~ = struck-through "before", **text** = highlighted "after"
  function rich(s) {
    return esc(s)
      .replace(/~~(.+?)~~/g, '<span class="strike">$1</span>')
      .replace(/\*\*(.+?)\*\*/g, '<span class="num">$1</span>');
  }
  function safeUrl(u) {
    u = String(u || "");
    return /^(https?:|mailto:|assets\/|\.\/|\/)/i.test(u) ? u : "#";
  }

  // ---------- analytics (GoatCounter) ----------
  var queue = [];
  function track(path, title) {
    if (PREVIEW) return;
    queue.push({ path: path, title: title || path, event: true });
    flush();
  }
  function flush() {
    var gc = window.goatcounter;
    if (!gc || typeof gc.count !== "function") return;
    while (queue.length) { try { gc.count(queue.shift()); } catch (e) {} }
  }
  function loadAnalytics(code) {
    if (PREVIEW || !code) return;
    code = String(code).replace(/[^a-z0-9-]/gi, "");
    // Keep the page path clean (drops ?r=… from the pageview)
    window.goatcounter = { path: function () { return location.pathname || "/"; } };
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter", "https://" + code + ".goatcounter.com/count");
    s.onload = function () { var n = 0; (function wait() { if (window.goatcounter && window.goatcounter.count) flush(); else if (n++ < 40) setTimeout(wait, 250); })(); };
    document.head.appendChild(s);
    if (REF) track("ref/" + REF, "Visit from tracked link " + REF);
  }

  // ---------- rendering ----------
  function list(items) {
    return "<ul>" + (items || []).map(function (i) {
      return "<li><span>" + esc(i.name) + "</span><span>" + esc(i.year) + "</span></li>";
    }).join("") + "</ul>";
  }

  function render(c) {
    var p = c.profile || {}, st = c.settings || {};
    document.title = st.siteTitle || p.name || "Portfolio";
    var md = document.querySelector('meta[name="description"]');
    if (md && st.metaDescription) md.setAttribute("content", st.metaDescription);

    var cv = st.cvUrl ? '<a class="btn ghost" href="' + esc(safeUrl(st.cvUrl)) + '" target="_blank" rel="noopener" data-track="cv-download">Download CV</a>' : "";
    var li = p.linkedin ? '<a class="btn ghost" href="' + esc(safeUrl(p.linkedin)) + '" target="_blank" rel="noopener" data-track="linkedin">LinkedIn ↗</a>' : "";

    var ledgerRows = ((c.ledger || {}).rows || []).map(function (r) {
      var b = +r.before || 0, a = +r.after || 0, max = Math.max(b, a) || 1;
      return '<div class="row"><div><h3>' + esc(r.title) + '</h3><div class="ctx">' + esc(r.context) + '</div></div>' +
        '<div class="bars" role="img" aria-label="' + esc(r.title + ": before " + r.beforeLabel + ", after " + r.afterLabel) + '">' +
        '<div class="bar"><span>' + esc(r.beforeLabel) + '</span><div class="track"><div class="fill" style="width:' + (b / max * 100) + '%"></div></div></div>' +
        '<div class="bar after"><span>' + esc(r.afterLabel) + '</span><div class="track"><div class="fill" style="width:' + Math.max(a / max * 100, 1.5) + '%"></div></div></div></div>' +
        '<div class="delta"><b>' + esc(r.delta) + '</b><small>' + esc(r.sub) + '</small></div></div>';
    }).join("");

    var cats = { seller: "Sellers", customer: "Customers", ops: "Operations" };
    var usedCats = {};
    (c.cases || []).forEach(function (k) { usedCats[k.category] = true; });
    var chips = '<button class="chip" type="button" data-f="all" aria-pressed="true">All</button>' +
      Object.keys(cats).filter(function (k) { return usedCats[k]; }).map(function (k) {
        return '<button class="chip" type="button" data-f="' + k + '" aria-pressed="false">' + cats[k] + "</button>";
      }).join("");

    var cases = (c.cases || []).map(function (k) {
      var secs = (k.sections || []).map(function (s) {
        return '<div><dt class="label">' + esc(s.label) + "</dt><dd>" + esc(s.text) + "</dd></div>";
      }).join("");
      var imgs = (k.images || []).length ? '<div class="shots">' + k.images.map(function (im) {
        return '<figure><img src="' + esc(safeUrl(im.src)) + '" alt="' + esc(im.alt) + '" loading="lazy"><figcaption>' + esc(im.caption) + "</figcaption></figure>";
      }).join("") + "</div>" : "";
      var todo = PREVIEW && k.todo ? '<span class="todo">' + esc(k.todo) + "</span>" : "";
      return '<article class="case' + (k.wide ? " wide" : "") + '" data-k="' + esc(k.category) + '" data-id="' + esc(k.id) + '">' +
        '<div class="meta"><span class="tag">' + esc(k.tag) + '</span><span class="label">' + esc(k.period) + "</span></div>" +
        "<h3>" + esc(k.title) + '</h3><p class="result">' + esc(k.result) + "</p><dl>" + secs + "</dl>" + imgs + todo + "</article>";
    }).join("");

    var principles = (c.principles || []).map(function (x) {
      return "<div><h3>" + esc(x.title) + "</h3><p>" + esc(x.text) + "</p></div>";
    }).join("");

    var jobs = (c.jobs || []).map(function (j) {
      return '<div class="job' + (j.current ? " now" : "") + '"><div class="when">' + esc(j.when) + "</div><div><h3>" + esc(j.role) +
        '</h3><div class="co">' + esc(j.company) + "</div><p>" + esc(j.text) + "</p></div></div>";
    }).join("");

    var facts = (p.facts || []).map(function (f) {
      return '<div><dt class="label">' + esc(f.label) + "</dt><dd>" + esc(f.value) + "</dd></div>";
    }).join("");

    document.getElementById("app").innerHTML =
      '<header class="top"><a class="mark" href="#top">' + esc(p.name) + '<span>.</span></a>' +
      '<nav aria-label="Sections"><a href="#impact">Impact</a><a href="#work">Case studies</a><a href="#experience">Experience</a><a href="#contact">Contact</a></nav></header>' +

      '<div class="hero" id="top"><div><p class="label">' + esc(p.eyebrow) + '</p><h1 style="margin-top:18px">' + rich(p.headline) + "</h1>" +
      '<p class="lede">' + esc(p.lede) + '</p><div class="cta"><a class="btn" href="#work" data-track="cta-case-studies">See case studies</a>' + li + cv + "</div></div>" +
      '<dl class="facts">' + facts + "</dl></div>" +

      '<section id="impact" aria-labelledby="impact-h"><div class="sec-head"><h2 id="impact-h">Impact ledger</h2><p>' + esc((c.ledger || {}).intro) + "</p></div>" +
      '<div class="ledger">' + ledgerRows + '</div><p class="ledger-note">' + esc((c.ledger || {}).note) + "</p></section>" +

      '<section id="work" aria-labelledby="work-h"><div class="sec-head"><h2 id="work-h">Case studies</h2><div class="filters" role="group" aria-label="Filter case studies">' + chips + "</div></div>" +
      '<div class="cases">' + cases + "</div></section>" +

      (principles ? '<section aria-labelledby="how-h"><div class="sec-head"><h2 id="how-h">How I work</h2></div><div class="principles">' + principles + "</div></section>" : "") +

      '<section id="experience" aria-labelledby="exp-h"><div class="sec-head"><h2 id="exp-h">Experience</h2><p>' + esc(c.experienceIntro) + "</p></div>" +
      '<div class="timeline">' + jobs + "</div>" +
      '<div class="creds"><div><p class="label">Certifications</p>' + list(c.certifications) + "</div>" +
      '<div><p class="label">Education</p>' + list(c.education) +
      ((c.leadership || []).length ? '<p class="label" style="margin-top:32px">Leadership</p>' + list(c.leadership) : "") + "</div></div></section>" +

      '<section class="contact" id="contact" aria-labelledby="contact-h"><p class="label">Contact</p><h2 id="contact-h" style="margin-top:14px">' + esc(p.contactHeadline) + "</h2>" +
      '<div class="contact-row"><a class="email" id="email" href="mailto:' + esc(p.email) + '" data-track="email-click">' + esc(p.email) + "</a>" +
      '<button class="btn ghost" type="button" id="copy">Copy email</button>' + (p.linkedin ? '<a class="btn" href="' + esc(safeUrl(p.linkedin)) + '" target="_blank" rel="noopener" data-track="linkedin">LinkedIn ↗</a>' : "") +
      '<span class="copied" id="copied" aria-live="polite"></span></div></section>' +
      "<footer><span>© " + new Date().getFullYear() + " " + esc(p.fullName || p.name) + "</span><span>" + esc(p.location) + "</span></footer>";

    wire();
  }

  function wire() {
    // filters
    var chips = document.querySelectorAll(".chip");
    chips.forEach(function (ch) {
      ch.addEventListener("click", function () {
        chips.forEach(function (x) { x.setAttribute("aria-pressed", x === ch ? "true" : "false"); });
        var f = ch.getAttribute("data-f");
        document.querySelectorAll(".case").forEach(function (el) { el.hidden = !(f === "all" || el.getAttribute("data-k") === f); });
        if (f !== "all") track("filter/" + f, "Filtered case studies: " + f);
      });
    });
    // tracked clicks
    document.querySelectorAll("[data-track]").forEach(function (el) {
      el.addEventListener("click", function () { track("click/" + el.getAttribute("data-track"), "Clicked " + el.getAttribute("data-track")); });
    });
    // copy email
    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", function () {
      var out = document.getElementById("copied"), em = document.getElementById("email");
      track("click/email-copy", "Copied email");
      function select() { var r = document.createRange(); r.selectNodeContents(em); var s = getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent = "Selected, press Ctrl/Cmd + C"; }
      if (navigator.clipboard) navigator.clipboard.writeText(em.textContent).then(function () { out.textContent = "Copied"; }, select); else select();
    });
    // case studies read (half visible for 1.5s)
    if ("IntersectionObserver" in window) {
      var timers = {};
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var id = e.target.getAttribute("data-id");
          if (e.isIntersecting) {
            timers[id] = setTimeout(function () { track("case/" + id, "Read case study: " + id); io.unobserve(e.target); }, 1500);
          } else clearTimeout(timers[id]);
        });
      }, { threshold: 0.5 });
      document.querySelectorAll(".case").forEach(function (el) { io.observe(el); });
      // reached contact section
      var contact = document.getElementById("contact");
      if (contact) {
        var io2 = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { track("section/contact", "Scrolled to contact"); io2.disconnect(); } });
        io2.observe(contact);
      }
    }
  }

  function fail() {
    document.getElementById("app").innerHTML = '<p class="load-msg">The portfolio could not load. Please refresh, or email ahmadyehiam@gmail.com.</p>';
  }

  // ---------- boot ----------
  if (PREVIEW) {
    document.getElementById("preview-bar").hidden = false;
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem("portfolio-draft") || "null"); } catch (e) {}
    if (draft) { render(draft); return; }
  }
  fetch("content.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (c) { render(c); loadAnalytics((c.settings || {}).goatcounter); })
    .catch(fail);
})();
</script>
</body>
</html>
